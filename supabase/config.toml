project_id = "tr8"

# Callback relays have no user JWT. POST handlers verify Supabase Auth and a live
# initiating session; the worker verifies its dedicated secret before any work.
[functions.tr8-google]
verify_jwt = false

[functions.tr8-google-worker]
verify_jwt = false

# The financial handler verifies signed user claims itself and remains closed
# unless both the test-project environment gate and the DB synthetic allowlist
# permit the request. No production financial mode is implemented in 6B.1.
[functions.tr8-finance]
verify_jwt = false

# Separate synthetic restore endpoint; verifies the bearer inside the handler.
[functions.tr8-finance-restore-test]
verify_jwt = false
