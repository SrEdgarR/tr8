name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:edge
      - run: npm run typecheck:mcp
      - run: npm run typecheck:finance:test
      - run: npm test
      - run: npm run test:edge
      - run: npm run test:database:static
      - run: npm run build
      - run: npm run build:finance:test
      - run: npm run build:finance:domain:test
      - run: npm run build:finance:ui:test
