name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:edge
      - run: npm run typecheck:finance:test
      - run: npm test
      - run: npm run test:edge
      - run: npm run test:database:static
      - run: npm run build
      - run: npm run build:finance:test
